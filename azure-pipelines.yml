# ============================================================
#  UvaTea Enterprise Server — DEV Branch CI/CD Pipeline
#  Trigger  : push to 'dev' branch
#  Flow      : Build → Unit Tests → Docker Push → Deploy (Testing)
# ============================================================

trigger:
  branches:
    include:
      - develop

pr: none   # PR builds handled separately

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: uvatea-testing-vars          # Azure DevOps Library → Variable Group
  - name: buildConfiguration
    value: 'Release'
  - name: dockerRepository
    value: '$(DOCKER_HUB_USERNAME)/uvatea-api'
  - name: dockerRegistryServiceConnection
    value: 'docker-hub-connection'       # Azure DevOps Service Connection name
  - name: imageTag
    value: 'dev-$(Build.BuildId)'

# ─────────────────────────────────────────────
# STAGE 1 — Build & Unit Tests
# ─────────────────────────────────────────────
stages:
- stage: BuildAndTest
  displayName: '🧪 Build & Unit Tests'
  jobs:
  - job: BuildTestJob
    displayName: 'Restore → Build → Test'
    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET 10 SDK'
      inputs:
        packageType: 'sdk'
        version: '10.x'

    - script: dotnet restore
      displayName: '📦 Restore NuGet Packages'
      workingDirectory: '$(Build.SourcesDirectory)'

    - script: dotnet build --configuration $(buildConfiguration) --no-restore
      displayName: '🏗️ Build Solution'
      workingDirectory: '$(Build.SourcesDirectory)'

    - script: |
        dotnet test tests/UverTeaServerApp.UnitTests/UverTeaServerApp.UnitTests.csproj \
          --configuration $(buildConfiguration) \
          --no-build \
          --verbosity normal \
          --logger "trx;LogFileName=test-results.trx" \
          --results-directory $(Agent.TempDirectory)/TestResults
      displayName: '✅ Run Unit Tests'
      workingDirectory: '$(Build.SourcesDirectory)'

    - task: PublishTestResults@2
      displayName: '📊 Publish Test Results'
      condition: always()
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: '$(Agent.TempDirectory)/TestResults/*.trx'
        failTaskOnFailedTests: true

# ─────────────────────────────────────────────
# STAGE 2 — Docker Build & Push to Docker Hub
# ─────────────────────────────────────────────
- stage: DockerBuildPush
  displayName: '🐋 Docker Build & Push (Testing)'
  dependsOn: BuildAndTest
  condition: succeeded()
  jobs:
  - job: DockerJob
    displayName: 'Build Image → Push → Docker Hub'
    steps:
    - task: Docker@2
      displayName: '🐋 Build & Push → dev-$(Build.BuildId)'
      inputs:
        command: 'buildAndPush'
        repository: '$(dockerRepository)'
        dockerfile: 'Dockerfile'
        containerRegistry: '$(dockerRegistryServiceConnection)'
        tags: |
          dev-$(Build.BuildId)
          dev-latest

# ─────────────────────────────────────────────
# STAGE 3 — Deploy to Testing Environment
# ─────────────────────────────────────────────
- stage: DeployTesting
  displayName: '🟡 Deploy → Testing Environment'
  dependsOn: DockerBuildPush
  condition: succeeded()
  jobs:
  - deployment: DeployToTestingJob
    displayName: 'Deploy Docker Image to Azure App Service (Dev)'
    environment: 'uvatea-testing'        # Azure DevOps Environment (for history/tracking)
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebAppContainer@1
            displayName: '🚀 Deploy to Azure App Service (uvatea-api-dev)'
            inputs:
              azureSubscription: 'azure-service-connection'   # Azure DevOps Service Connection
              appName: '$(AZURE_APP_SERVICE_NAME_DEV)'
              containers: '$(dockerRepository):dev-$(Build.BuildId)'

          # Inject environment variables into Azure App Service
          - task: AzureAppServiceSettings@1
            displayName: '⚙️ Configure App Settings (Testing Env Vars)'
            inputs:
              azureSubscription: 'azure-service-connection'
              appName: '$(AZURE_APP_SERVICE_NAME_DEV)'
              appSettings: |
                [
                  { "name": "ASPNETCORE_ENVIRONMENT",             "value": "Testing",                            "slotSetting": false },
                  { "name": "ConnectionStrings__DefaultConnection","value": "$(DB_CONNECTION_STRING)",            "slotSetting": false },
                  { "name": "ConnectionStrings__Redis",            "value": "$(REDIS_CONNECTION_STRING)",         "slotSetting": false },
                  { "name": "JwtSettings__Secret",                 "value": "$(JWT_SECRET)",                      "slotSetting": false },
                  { "name": "EmailSettings__Password",             "value": "$(EMAIL_PASSWORD)",                  "slotSetting": false }
                ]

          # Health check after deploy
          - script: |
              echo "⏳ Waiting for app to start..."
              sleep 30
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://$(AZURE_APP_SERVICE_NAME_DEV).azurewebsites.net/health)
              if [ "$STATUS" = "200" ]; then
                echo "✅ Health check passed — HTTP $STATUS"
              else
                echo "❌ Health check failed — HTTP $STATUS"
                exit 1
              fi
            displayName: '🩺 Health Check'