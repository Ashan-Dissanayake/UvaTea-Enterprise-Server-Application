trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  dockerRegistryServiceConnection: 'docker-hub-connection' 
  dockerRepository: 'ashanpd/uvateb-api'
  [string]tag1: $[eq(variables['Build.SourceBranchName'], 'main') && 'latest' || 'dev']
  [string]tag2: $[eq(variables['Build.SourceBranchName'], 'main') && format('v1.0.{0}', variables['Build.BuildId']) || format('dev-{0}', variables['Build.BuildId'])]

stages:
- stage: BuildAndTest
  displayName: 'Quality Gate: Build & Unit Tests'
  jobs:
  - job: TestJob
    displayName: 'Compile Solution & Run Tests'
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '10.x'

    - script: dotnet restore
      displayName: 'Restore NuGet Packages'

    - script: dotnet build --configuration $(buildConfiguration) --no-restore
      displayName: 'Build Solution (.sln)'

    - script: dotnet test tests/UverTeaServerApp.UnitTests/UverTeaServerApp.UnitTests.csproj --configuration $(buildConfiguration) --no-build --verbosity normal
      displayName: 'Execute xUnit Unit Tests'

- stage: DockerBuildAndPush
  displayName: 'Dockerize & Push to Registry'
  dependsOn: BuildAndTest
  condition: succeeded()
  jobs:
  - job: PushJob
    displayName: 'Build Docker Image & Push to Docker Hub'
    steps:
    - task: Docker@2
      displayName: 'Build and Push Docker Image'
      inputs:
        command: 'buildAndPush'
        repository: '$(dockerRepository)'
        dockerfile: 'Dockerfile'
        containerRegistry: '$(dockerRegistryServiceConnection)'
        tags: |
          $(tag1)
          $(tag2)